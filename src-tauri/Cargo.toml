[package]
name = "nocturne-pet"
version = "0.1.0"
description = "A private AI desktop pet"
authors = ["Desk Pal"]
edition = "2021"

[lib]
name = "nocturne_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "fs", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
